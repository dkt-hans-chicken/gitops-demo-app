name: CI

on:
  push:
    branches: [main]
    paths:
      - "app/**"

  pull_request:
    branches: [main]
    paths:
      - "app/**"

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/gitops-demo

jobs:
  build-and-push:
    name: Build and push image
    runs-on: ubuntu-latest

    outputs:
      image_tag: ${{ steps.meta.outputs.tag }}

    steps:
      - name: Checkout app repo
        uses: actions/checkout@v4

      - name: Generate image tag
        id: meta
        run: |
          SHORT_SHA=$(echo ${{ github.sha }} | cut -c1-7)
          echo "tag=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "Image tag: ${SHORT_SHA}"

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.IMAGE_NAME }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_NAME }}:latest

  update-manifests:
    name: Update manifest repo
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name != 'pull_request'

    steps:
      - name: Checkout manifest repo
        uses: actions/checkout@v4
        with:
          repository: ${{ secrets.MANIFEST_REPO }}   # e.g. your-org/gitops-demo-manifests
          token: ${{ secrets.MANIFEST_REPO_TOKEN }}   # PAT with repo write access
          path: manifests

      - name: Update image tag in deployment.yaml
        run: |
          cd manifests
          IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}
          IMAGE_FULL="${{ env.IMAGE_NAME }}:${IMAGE_TAG}"

          # Replace image tag in staging deployment
          sed -i "s|image: .*/gitops-demo:.*|image: ${IMAGE_FULL}|g" \
            k8s/staging/deployment.yaml

          echo "Updated image to: ${IMAGE_FULL}"
          cat k8s/staging/deployment.yaml

      - name: Commit and push to manifest repo
        run: |
          cd manifests
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          IMAGE_TAG=${{ needs.build-and-push.outputs.image_tag }}

          git add k8s/staging/deployment.yaml
          git diff --staged --quiet || git commit -m "ci: update staging image to ${IMAGE_TAG}

          Triggered by: ${{ github.repository }}@${{ github.sha }}
          Workflow:     ${{ github.workflow }}"

          git push
